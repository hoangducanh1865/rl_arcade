 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    // Add protobuf plugin for generating code from .proto files
    id 'com.google.protobuf' version '0.9.4'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    
    // Protobuf dependencies
    implementation 'com.google.protobuf:protobuf-java:3.24.4'
    implementation 'io.grpc:grpc-stub:1.58.0'
    implementation 'io.grpc:grpc-protobuf:1.58.0'
    implementation 'io.grpc:grpc-netty-shaded:1.58.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'rl_arcade.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// Protobuf configuration
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.24.4'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.58.0'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    outputSubDir = 'java'
                }
            }
            task.plugins {
                grpc {
                    outputSubDir = 'java'
                }
            }
        }
    }
}

// Task to copy generated proto files to protos directory
task copyGeneratedProtos(type: Copy) {
    dependsOn generateProto
    from "$buildDir/generated/source/proto/main/java"
    into "$projectDir/src/main/java"
    doLast {
        println "Proto files copied to src/main/java"
    }
}

// Task để generate trực tiếp vào src/main/java/rl_arcade/protos
task generateProtoToSource {
    dependsOn generateProto, copyGeneratedProtos
    description = 'Generate proto files directly to src/main/java'
    group = 'protobuf'
}

// Configure source sets
sourceSets {
    main {
        proto {
            srcDir '../proto'
        }
        java {
            srcDirs = ['src/main/java']
        }
    }
}

// Make build depend on copying protos
compileJava.dependsOn copyGeneratedProtos
